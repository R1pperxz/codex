name: Session index repair Windows debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Build Codex CLI
        run: cargo build -p codex-cli --bin codex
      - name: Upload Windows CLI
        uses: actions/upload-artifact@v4
        with:
          name: codex-session-index-repair-windows-debug
          path: codex-rs/target/debug/codex.exe
          if-no-files-found: error
